name: Fetch source documents

# Downloads official vendor documents (end-of-life pages, PSTI statements)
# so they can be read and turned into raw rows. Nothing is committed: the
# files are attached to the run for review.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs to fetch, separated by spaces or new lines'
        required: true

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p out
          i=0
          for u in $URLS; do
            i=$((i+1))
            name=$(printf '%03d' "$i")
            code=$(curl -sSL --max-time 90 -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15' \
              -H 'Accept-Language: en-GB,en;q=0.9' -o "out/$name" -w '%{http_code} %{content_type}' "$u" || echo "000 error")
            printf '%s\t%s\t%s\n' "$name" "$code" "$u" >> out/index.tsv
          done
          cat out/index.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: out/
          retention-days: 3
