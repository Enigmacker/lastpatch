name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: npm test
      - name: Dataset integrity
        run: |
          node -e '
            const d = require("./data/devices.json").devices;
            const bad = d.filter(r => !/^https?:\/\//.test(r.source_url) || !r.support_end_raw ||
              (r.support_end !== null && !/^\d{4}-\d{2}-\d{2}$/.test(r.support_end)));
            if (bad.length) { console.error(bad); process.exit(1); }
            console.log(d.length + " rows OK");
          '
      - name: Rebuilding raw data reproduces the dataset
        run: |
          node scripts/build.js "$(node -p 'require("./data/devices.json").generated')"
          git diff --exit-code data/devices.json

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - name: Check pages, links and scripts
        run: npm run check:site
