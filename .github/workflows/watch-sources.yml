name: Watch official sources

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every official source
        id: watch
        run: node scripts/watch-sources.js --report report.md

      - name: Refresh the CISA exploited vulnerabilities extract
        run: node scripts/update-kev.js

      - name: Refresh the latest published firmware (AVM download server)
        continue-on-error: true
        run: node scripts/update-firmware.js

      - name: Save fingerprints, the vulnerabilities extract and the firmware list
        run: |
          git add data/sources-state.json data/kev.json data/firmware.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Weekly refresh: source fingerprints, CISA KEV extract and latest firmware"
            git push
          fi

      - name: Mirror the full vendor lists (QNAP, Linksys) and propose changes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-vendor-lists.js || true
          if [ -n "$(git status --porcelain raw/)" ]; then
            node scripts/build.js
            branch="vendor-lists/$(date -u +%Y-%m-%d)"
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add raw/qnap-status.json raw/linksys-eol.json data/devices.json 2>/dev/null || true
            git commit -m "Vendor lists: refresh QNAP and Linksys end-of-support tables"
            git push -u origin "$branch"
            gh pr create --title "Vendor lists changed (QNAP / Linksys)" \
              --body "The official QNAP and/or Linksys end-of-support tables changed. Review the date changes in raw/ before merging."
          fi

      - name: Open or update the review issue
        if: steps.watch.outputs.changed != '0' || steps.watch.outputs.errors != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-watch --color D93F0B --description "An official source changed" --force
          number=$(gh issue list --label source-watch --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Official sources changed" --label source-watch --body-file report.md
          fi
