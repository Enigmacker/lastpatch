name: Watch official sources

on:
  schedule:
    - cron: '17 6 * * 1' # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every official source
        id: watch
        run: node scripts/watch-sources.js --report report.md

      - name: Refresh the CISA exploited vulnerabilities extract
        run: node scripts/update-kev.js

      - name: Save fingerprints and the vulnerabilities extract
        run: |
          git add data/sources-state.json data/kev.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Weekly refresh: source fingerprints and CISA KEV extract"
            git push
          fi

      - name: Open or update the review issue
        if: steps.watch.outputs.changed != '0' || steps.watch.outputs.errors != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-watch --color D93F0B --description "An official source changed" --force
          number=$(gh issue list --label source-watch --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Official sources changed" --label source-watch --body-file report.md
          fi
